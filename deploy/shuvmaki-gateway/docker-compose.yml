# shuvmaki self-hosted Discord gateway stack.
# Postgres + remorses/gateway-proxy (multi-client-support) + onboarding HTTP.
# Fill env.example -> .env. Do not commit secrets. Do not register a Discord
# app from this repo.

name: shuvmaki-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shuvmaki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shuvmaki}
    volumes:
      - shuvmaki-gateway-postgres:/var/lib/postgresql/data
      - ./init-gateway-clients.sql:/docker-entrypoint-initdb.d/init-gateway-clients.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-shuvmaki} -d ${POSTGRES_DB:-shuvmaki}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway-proxy:
    # remorses/gateway-proxy branch multi-client-support. The public
    # docker.io/gelbpunkt/gateway-proxy image is the upstream binary and does
    # not read DIRECT_DATABASE_URL / gateway_clients. Use it only if you build
    # and push a multi-client image yourself:
    #   image: docker.io/gelbpunkt/gateway-proxy:x86-64
    build:
      context: ../../gateway-proxy
      dockerfile: Dockerfile
      args:
        TARGET_CPU: x86-64
    image: shuvmaki-gateway-proxy:local
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      DIRECT_DATABASE_URL: postgres://${POSTGRES_USER:-shuvmaki}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shuvmaki}?sslmode=disable
      DATABASE_URL: postgres://${POSTGRES_USER:-shuvmaki}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shuvmaki}?sslmode=disable
      # Omit the token JSON key so the binary falls back to TOKEN.
      # Match Kimaki's client intents: Guilds, Guild Messages, Message Content,
      # and Guild Voice States. Do not request privileged member/presence access.
      CONFIG: |
        {
          "log_level": "info",
          "intents": 33409,
          "port": 7878,
          "validate_token": true,
          "externally_accessible_url": "${PUBLIC_GATEWAY_WS_URL:-wss://gateway.shuv.bot}",
          "cache": {
            "channels": false,
            "presences": false,
            "emojis": false,
            "current_member": false,
            "members": false,
            "roles": true,
            "scheduled_events": false,
            "stage_instances": false,
            "stickers": false,
            "users": false,
            "voice_states": false
          }
        }
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  onboarding:
    build:
      context: ./onboarding
      dockerfile: dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-shuvmaki}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shuvmaki}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      PUBLIC_WEBSITE_URL: ${PUBLIC_WEBSITE_URL:-https://shuvmaki.shuv.bot}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  shuvmaki-gateway-postgres:
